location = /codexbridge-install-test/component-catalog.json {
    alias /opt/shanhai/codexbridge-installer/public/component-catalog.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /codexbridge-install-test/component-catalog.json.sig {
    alias /opt/shanhai/codexbridge-installer/public/component-catalog.json.sig;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /codexbridge-test/packages/ {
    alias /opt/shanhai/codexbridge-installer/public/packages/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
