name: Desktop Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/all-model-contract-lock"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Windows user temp directory
        shell: pwsh
        run: |
          $userTemp = Join-Path $env:USERPROFILE "AppData\Local\Temp"
          New-Item -ItemType Directory -Force -Path $userTemp | Out-Null
          "TEMP=$userTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$userTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run full project check
        env:
          CODEXBRIDGE_SKIP_WINDOWS_HOSTED_RUNNER_INTEGRATION: "1"
        run: npm run check

      - name: Run isolated software-manager transaction
        env:
          CODEXBRIDGE_SKIP_WINDOWS_HOSTED_RUNNER_INTEGRATION: "1"
          CODEXBRIDGE_SOFTWARE_MANAGER_FAKE_HOST: "1"
          CODEXBRIDGE_SOFTWARE_MANAGER_TEST_ROOT: "${{ runner.temp }}\\codexbridge-software-manager"
        run: npm run test:software-manager

      - name: Run Windows release preflight
        run: node scripts/release-preflight.mjs --platform win32 --arch x64

      - name: Package Windows portable app
        env:
          CODEXBRIDGE_RELEASE_VERSION: ${{ github.ref_name }}
        run: npm run package:win

      - name: Smoke test packaged Windows app
        env:
          CODEXBRIDGE_SOFTWARE_MANAGER_FAKE_HOST: "1"
          CODEXBRIDGE_SOFTWARE_MANAGER_TEST_ROOT: "${{ runner.temp }}\\codexbridge-software-manager-package"
        run: npm run package:win:smoke

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Create Windows release artifacts
        run: npm run package:win:artifacts

      - name: Run Windows release artifact preflight
        run: node scripts/release-preflight.mjs --platform win32 --arch x64 --release-dir dist-artifacts --write-gate-report windows-release-gate.json

      - name: Smoke install Windows Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $smokeRoot = Join-Path $env:RUNNER_TEMP "codexbridge-setup-smoke"
          $installRoot = Join-Path $smokeRoot "installed"
          $smokeHome = Join-Path $smokeRoot "home"
          $smokeCodex = Join-Path $smokeHome ".codex"
          $smokeData = Join-Path $smokeRoot "data"
          $smokeLocalAppData = Join-Path $smokeRoot "local-app-data"
          $setupCopy = Join-Path $smokeRoot "CodexBridge-Windows-x64-Setup.exe"
          New-Item -ItemType Directory -Force -Path $smokeRoot, $smokeHome, $smokeCodex, $smokeData, $smokeLocalAppData | Out-Null
          Set-Content -LiteralPath (Join-Path $smokeCodex "config.toml") -Encoding utf8 -Value @(
            'sandbox_mode = "workspace-write"'
            'model = "gpt-5.5"'
            'model_reasoning_effort = "high"'
            'approval_policy = "on-request"'
          )
          Copy-Item -LiteralPath "dist-artifacts\CodexBridge-Windows-x64-Setup.exe" -Destination $setupCopy
          $sourceSetupHash = (Get-FileHash -LiteralPath "dist-artifacts\CodexBridge-Windows-x64-Setup.exe" -Algorithm SHA256).Hash
          $copiedSetupHash = (Get-FileHash -LiteralPath $setupCopy -Algorithm SHA256).Hash
          if ($sourceSetupHash -ne $copiedSetupHash) {
            throw "Setup smoke copy SHA-256 does not match the release artifact."
          }
          $env:CODEXBRIDGE_DESKTOP_SMOKE = "1"
          $env:CODEXBRIDGE_DESKTOP_SMOKE_START_ROUTER = "1"
          $env:CODEXBRIDGE_DESKTOP_SMOKE_HOME = $smokeHome
          $env:CODEXBRIDGE_DESKTOP_SMOKE_LOCAL_APP_DATA = $smokeLocalAppData
          $env:CODEXBRIDGE_DATA_DIR = $smokeData
          $env:CODEXBRIDGE_INSTALLER_NO_LAUNCH = "1"
          $installer = Start-Process -FilePath $setupCopy -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) {
            throw "Setup smoke installer exited with code $($installer.ExitCode)."
          }
          $installedApp = Join-Path $installRoot "app-$version"
          $installedExe = Join-Path $installedApp "CodexBridge.exe"
          $buildMetadata = Join-Path $installedApp "resources\app\.codexbridge-build.json"
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "Setup smoke did not install CodexBridge.exe."
          }
          if (-not (Test-Path -LiteralPath $buildMetadata -PathType Leaf)) {
            throw "Setup smoke did not preserve release build metadata."
          }
          $installedMetadata = Get-Content -LiteralPath $buildMetadata -Raw | ConvertFrom-Json
          $packagedSmoke = Get-Content -LiteralPath "release\packaged-smoke-report.json" -Raw | ConvertFrom-Json
          if ($installedMetadata.sourceFingerprint -ne $packagedSmoke.buildMetadata.sourceFingerprint) {
            throw "Setup smoke installed a different source fingerprint than packaged smoke proved."
          }
          $installedPackage = Get-Content -LiteralPath (Join-Path $installedApp "resources\app\package.json") -Raw | ConvertFrom-Json
          if ($installedPackage.version -ne $version) {
            throw "Setup smoke installed an unexpected application version."
          }
          foreach ($relativePath in @("deploy", "state", "docs")) {
            if (Test-Path -LiteralPath (Join-Path $installedApp "resources\app\$relativePath")) {
              throw "Setup smoke installed forbidden package content: $relativePath"
            }
          }
          Remove-Item Env:CODEXBRIDGE_INSTALLER_NO_LAUNCH -ErrorAction SilentlyContinue
          $installedProcess = Start-Process -FilePath $installedExe -PassThru -WindowStyle Hidden
          if (-not $installedProcess.WaitForExit(180000)) {
            throw "Installed CodexBridge did not exit after desktop smoke."
          }
          if ($installedProcess.ExitCode -ne 0) {
            throw "Installed CodexBridge desktop smoke exited with code $($installedProcess.ExitCode)."
          }

      - name: Smoke test Windows release archive
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP "codexbridge-release-archive-smoke"
          New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
          Expand-Archive -LiteralPath "dist-artifacts/CodexBridge-Windows-x64-Portable.zip" -DestinationPath $extractPath -Force
          if (-not (Test-Path -LiteralPath (Join-Path $extractPath ".codexbridge-portable"))) {
            throw "Release archive does not contain .codexbridge-portable marker."
          }
          $expectedExePath = Join-Path $extractPath "CodexBridge.exe"
          $executables = @(Get-ChildItem -LiteralPath $extractPath -Filter "CodexBridge.exe" -File -Recurse)
          if ($executables.Count -ne 1 -or $executables[0].FullName -ne $expectedExePath) {
            throw "Release archive must contain exactly one root CodexBridge.exe."
          }
          $exe = $executables[0]
          if (-not (Test-Path -LiteralPath (Join-Path $exe.Directory.FullName "resources\app\package.json"))) {
            throw "Release archive does not contain resources\app\package.json beside CodexBridge.exe."
          }
          $archiveMetadataPath = Join-Path $exe.Directory.FullName "resources\app\.codexbridge-build.json"
          if (-not (Test-Path -LiteralPath $archiveMetadataPath -PathType Leaf)) {
            throw "Release archive does not contain build metadata."
          }
          $archiveMetadata = Get-Content -LiteralPath $archiveMetadataPath -Raw | ConvertFrom-Json
          $packagedSmoke = Get-Content -LiteralPath "release\packaged-smoke-report.json" -Raw | ConvertFrom-Json
          if ($archiveMetadata.sourceFingerprint -ne $packagedSmoke.buildMetadata.sourceFingerprint) {
            throw "Release archive source fingerprint does not match packaged smoke."
          }
          foreach ($relativePath in @("deploy", "state", "docs")) {
            if (Test-Path -LiteralPath (Join-Path $exe.Directory.FullName "resources\app\$relativePath")) {
              throw "Release archive contains forbidden package content: $relativePath"
            }
          }
          $env:CODEXBRIDGE_DESKTOP_SMOKE = "1"
          $env:CODEXBRIDGE_DATA_DIR = Join-Path $env:RUNNER_TEMP "codexbridge-release-archive-data"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Release archive desktop smoke exited with code $LASTEXITCODE."
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-Windows-x64
          path: |
            dist-artifacts/CodexBridge-Windows-x64-Portable.zip
            dist-artifacts/CodexBridge-Windows-x64-Setup.exe
            windows-release-gate.json

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run macOS packaging checks
        run: |
          node --check scripts/release-preflight.mjs
          node --check scripts/package-macos.mjs
          node --check scripts/smoke-packaged-macos.mjs
          node --check desktop/data-dir.cjs

      - name: Run catalog publisher POSIX tests
        run: node --test tests/software-manager-publisher.test.js

      - name: Run macOS release preflight
        run: node scripts/release-preflight.mjs --platform darwin --arch ${{ matrix.arch }} --write-gate-report macos-${{ matrix.arch }}-release-gate.json

      - name: Package macOS portable app
        env:
          CODEXBRIDGE_RELEASE_VERSION: ${{ github.ref_name }}
          CODEXBRIDGE_MAC_ARCH: ${{ matrix.arch }}
        run: npm run package:mac

      - name: Smoke test packaged macOS router
        env:
          CODEXBRIDGE_MAC_ARCH: ${{ matrix.arch }}
        run: npm run package:mac:smoke

      - name: Create macOS release archive
        run: |
          mkdir -p dist-artifacts
          app_path="$(find release -path "*/CodexBridge-darwin-${{ matrix.arch }}/CodexBridge.app" -type d | head -n 1)"
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "dist-artifacts/CodexBridge-macOS-${{ matrix.arch }}-Portable.zip"

      - name: Smoke test macOS release archive
        run: |
          smoke_dir="$RUNNER_TEMP/codexbridge-macos-release-archive-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$smoke_dir"
          ditto -x -k "dist-artifacts/CodexBridge-macOS-${{ matrix.arch }}-Portable.zip" "$smoke_dir"
          test -f "$smoke_dir/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -f "$smoke_dir/CodexBridge.app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test -f "$smoke_dir/CodexBridge.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          test -f "$smoke_dir/CodexBridge.app/Contents/Resources/app/.codexbridge-build.json"
          test -x "$smoke_dir/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -x "$smoke_dir/CodexBridge.app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test -x "$smoke_dir/CodexBridge.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          for relative_path in deploy state docs; do
            test ! -e "$smoke_dir/CodexBridge.app/Contents/Resources/app/$relative_path"
          done

      - name: Upload macOS portable app
        uses: actions/upload-artifact@v4
        with:
          name: CodexBridge-macOS-${{ matrix.arch }}-Portable
          path: |
            dist-artifacts/CodexBridge-macOS-${{ matrix.arch }}-Portable.zip
            macos-${{ matrix.arch }}-release-gate.json

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare verified release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for name in \
            CodexBridge-Windows-x64-Setup.exe \
            CodexBridge-Windows-x64-Portable.zip \
            CodexBridge-macOS-arm64-Portable.zip \
            CodexBridge-macOS-x64-Portable.zip
          do
            source_path="$(find dist-artifacts -type f -name "$name" -print -quit)"
            test -n "$source_path"
            test -s "$source_path"
            cp "$source_path" "release-assets/$name"
            test -s "release-assets/$name"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Windows installer:
            https://github.com/${{ github.repository }}/releases/latest/download/CodexBridge-Windows-x64-Setup.exe

            Windows portable fallback:
            https://github.com/${{ github.repository }}/releases/latest/download/CodexBridge-Windows-x64-Portable.zip

            Mac M series:
            https://github.com/${{ github.repository }}/releases/latest/download/CodexBridge-macOS-arm64-Portable.zip

            Mac Intel:
            https://github.com/${{ github.repository }}/releases/latest/download/CodexBridge-macOS-x64-Portable.zip
          files: |
            release-assets/CodexBridge-Windows-x64-Setup.exe
            release-assets/CodexBridge-Windows-x64-Portable.zip
            release-assets/CodexBridge-macOS-arm64-Portable.zip
            release-assets/CodexBridge-macOS-x64-Portable.zip
